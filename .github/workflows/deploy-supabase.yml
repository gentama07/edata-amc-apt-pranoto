name: Deploy Supabase drive-sync

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/drive-sync/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-drive-sync
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Function drive-sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Tambahkan GitHub Actions secret SUPABASE_ACCESS_TOKEN untuk mengaktifkan deploy Edge Function."
            exit 1
          fi
          supabase functions deploy drive-sync --project-ref vokjrinidcsytasjeeuy
